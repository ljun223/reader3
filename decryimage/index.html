<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AES 解密图片工具</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      padding: 30px 20px;
      color: #333;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 30px;
    }
    h1 { font-size: 22px; margin-bottom: 24px; text-align: center; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: #555; }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      font-size: 14px;
    }
    input:focus, select:focus { outline: none; border-color: #1677ff; }
    .row { display: flex; gap: 16px; }
    .row .form-group { flex: 1; }
    button {
      width: 100%;
      padding: 12px;
      background: #1677ff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
    }
    button:hover { background: #4096ff; }
    button:disabled { background: #bae0ff; cursor: not-allowed; }
    .result { margin-top: 28px; display: none; }
    .result.show { display: block; }
    .img-box {
      border: 1px solid #e8e8e8;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      background: #fafafa;
    }
    .img-box img { max-width: 100%; max-height: 500px; border-radius: 4px; }
    .base64-box { margin-top: 16px; }
    textarea { height: 100px; font-family: monospace; font-size: 12px; resize: vertical; }
    .status { margin-top: 12px; font-size: 13px; color: #666; min-height: 20px; }
    .status.error { color: #ff4d4f; }
    .status.success { color: #52c41a; }
    .tips {
      margin-top: 20px;
      padding: 12px 16px;
      background: #f6f8fa;
      border-radius: 6px;
      font-size: 13px;
      color: #666;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AES 解密图片工具</h1>

    <div class="form-group">
      <label>图片加密链接 *</label>
      <input type="text" id="url" placeholder="https://...">
    </div>

    <div class="row">
      <div class="form-group">
        <label>AES Key *</label>
        <input type="text" id="key" value="f5d965df75336270">
      </div>
      <div class="form-group">
        <label>IV *</label>
        <input type="text" id="iv" value="97b60394abc2fbe1">
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label>加密模式</label>
        <select id="mode">
          <option value="CBC" selected>AES-CBC</option>
          <option value="ECB">AES-ECB</option>
        </select>
      </div>
      <div class="form-group">
        <label>Key / IV 格式</label>
        <select id="keyFormat">
          <option value="utf8" selected>UTF-8 字符串（推荐）</option>
          <option value="hex">Hex 十六进制</option>
        </select>
      </div>
      <div class="form-group">
        <label>Padding</label>
        <select id="padding">
          <option value="Pkcs7" selected>PKCS7</option>
          <option value="ZeroPadding">ZeroPadding</option>
          <option value="NoPadding">NoPadding</option>
        </select>
      </div>
    </div>

    <button id="btn" onclick="decryptImage()">开始解密</button>
    <div class="status" id="status"></div>

    <div class="result" id="result">
      <h3>解密结果预览</h3>
      <div class="img-box">
        <img id="preview" alt="解密后的图片">
      </div>
      <div class="base64-box">
        <label>Base64 数据（可复制）</label>
        <textarea id="base64" readonly></textarea>
      </div>
    </div>

    <div class="tips">
      <strong>当前参数已针对你提供的链接预设好。</strong><br>
      Key 和 IV 请保持「UTF-8 字符串」选项，不要改成 Hex。<br>
      如果以后遇到其他加密图，再根据实际情况调整格式。
    </div>
  </div>

  <script>
    async function decryptImage() {
      const url = document.getElementById('url').value.trim();
      const keyStr = document.getElementById('key').value.trim();
      const ivStr = document.getElementById('iv').value.trim();
      const mode = document.getElementById('mode').value;
      const keyFormat = document.getElementById('keyFormat').value;
      const padding = document.getElementById('padding').value;

      const statusEl = document.getElementById('status');
      const btn = document.getElementById('btn');
      const resultEl = document.getElementById('result');

      if (!url || !keyStr) {
        statusEl.className = 'status error';
        statusEl.textContent = '请填写图片链接和 Key';
        return;
      }

      btn.disabled = true;
      statusEl.className = 'status';
      statusEl.textContent = '正在获取加密数据...';
      resultEl.classList.remove('show');

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`请求失败: ${response.status}`);
        const encryptedBuffer = await response.arrayBuffer();
        statusEl.textContent = `数据获取成功（${encryptedBuffer.byteLength} 字节），正在解密...`;

        // 解析 Key
        let key = keyFormat === 'hex' 
          ? CryptoJS.enc.Hex.parse(keyStr) 
          : CryptoJS.enc.Utf8.parse(keyStr);

        // 解析 IV
        let iv = null;
        if (mode === 'CBC') {
          if (!ivStr) throw new Error('CBC 模式必须填写 IV');
          iv = keyFormat === 'hex' 
            ? CryptoJS.enc.Hex.parse(ivStr) 
            : CryptoJS.enc.Utf8.parse(ivStr);
        }

        const encryptedWordArray = CryptoJS.lib.WordArray.create(encryptedBuffer);

        const decrypted = CryptoJS.AES.decrypt(
          { ciphertext: encryptedWordArray },
          key,
          {
            iv: iv,
            mode: CryptoJS.mode[mode],
            padding: CryptoJS.pad[padding]
          }
        );

        const base64 = decrypted.toString(CryptoJS.enc.Base64);
        if (!base64) throw new Error('解密结果为空，请检查 Key、IV 或格式是否正确');

        // 自动判断图片类型（简单判断）
        const header = atob(base64.slice(0, 20));
        let mime = 'image/jpeg';
        if (header.startsWith('\x89PNG')) mime = 'image/png';
        else if (header.startsWith('GIF8')) mime = 'image/gif';
        else if (header.startsWith('RIFF')) mime = 'image/webp';

        const dataUrl = `data:\( {mime};base64, \){base64}`;

        document.getElementById('preview').src = dataUrl;
        document.getElementById('base64').value = dataUrl;

        resultEl.classList.add('show');
        statusEl.className = 'status success';
        statusEl.textContent = '解密成功！';

      } catch (err) {
        console.error(err);
        statusEl.className = 'status error';
        statusEl.textContent = '错误: ' + err.message;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
